<!doctype html>
<html lang="en" data-mode="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="chimin's arctic sketchbook: projects, writing, photos and travel notes, drawn by hand." />
    <title>chimin</title>
    <script>
      // Apply the saved mode before first paint so the paper never flashes.
      try {
        var m = localStorage.getItem('mode');
        if (m === 'day' || m === 'night') document.documentElement.dataset.mode = m;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
