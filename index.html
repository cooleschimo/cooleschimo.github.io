<!doctype html>
<html lang="en" data-mode="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="chimin's arctic sketchbook: projects, writing, photos and travel notes, drawn by hand." />
    <title>chimin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27%23f0c66a%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27none%27 stroke=%27%232f3b4a%27 stroke-width=%272%27 stroke-dasharray=%273 2%27/%3E%3C/svg%3E" />
    <script>
      // Apply the saved mode before first paint so the paper never flashes.
      try {
        var m = localStorage.getItem('mode');
        if (m === 'day' || m === 'night') document.documentElement.dataset.mode = m;
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
